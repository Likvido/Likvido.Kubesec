name: Publish to nuget

on:
  push:
    branches:
      - master
    paths:
      - Likvido.Kubesec/version.props
      - .github/workflows/nuget.yml

# The job checks out the repository and publishes to nuget.org with Trusted Publishing, so it needs
# read access to the contents and permission to request an OIDC token for the token exchange.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Publish NuGet
        uses: likvido/action-nuget@v2
        with:
          project: Likvido.Kubesec/Likvido.Kubesec/Likvido.Kubesec.csproj
          nuget-user: ${{ vars.NUGET_USER }}
